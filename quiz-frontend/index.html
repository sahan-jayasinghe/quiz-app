<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport meta tag:
      Makes the layout work correctly on mobile devices by setting
      the visible area (viewport) to the device's actual width.
      Without this, mobile browsers zoom out to show a desktop layout.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: Descriptive page title shown in the browser tab -->
    <title>Quiz Admin — Question Manager</title>

    <!-- SEO: Meta description for search engines -->
    <meta
      name="description"
      content="Quiz Admin Panel — manage and view all quiz questions from your Spring Boot backend."
    />

    <!--
      The favicon is the small icon shown in the browser tab.
      /vite.svg is included in the Vite default project.
    -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  </head>
  <body>
    <!--
      This single <div id="root"> is the ONLY thing React needs.
      ReactDOM.createRoot(document.getElementById("root")) in main.jsx
      finds this element and injects the entire React component tree here.
      Before React loads, this div is completely empty.
    -->
    <div id="root"></div>

    <!--
      type="module" tells the browser this is an ES Module.
      Vite serves main.jsx as a module during development.
      During production build, Vite replaces this with a
      hashed, optimized bundle file.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
